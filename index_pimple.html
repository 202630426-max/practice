<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearSkin - 여드름 개선 라이프 루틴 플래너</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #666;
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select, input[type="time"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #eee;
            transition: all 0.2s;
        }

        .checkbox-item:hover {
            background: #eef5fc;
        }

        .checkbox-item input {
            margin-right: 8px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background 0.3d;
        }

        .btn-submit:hover {
            background: #357ABD;
        }

        /* 결과 화면 스타일 */
        #result-section {
            display: none;
        }

        .routine-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 12px;
            background: #f9f9f9;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 8px 8px 0;
        }

        .time-badge {
            background: var(--primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 15px;
            white-space: nowrap;
        }

        .routine-content h4 {
            margin-bottom: 4px;
            color: #333;
        }

        .routine-content p {
            font-size: 0.95rem;
            color: #666;
        }

        .tip-box {
            background-color: #E8F8F5;
            border: 1px solid var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .tip-box h4 {
            color: #16A085;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ ClearSkin 플래너</h1>
        <p>맞춤형 습관 설계를 통해 깨끗하고 건강한 피부를 만들어보세요.</p>
    </header>

    <form id="skin-form">
        <!-- 1. 여드름 상태 입력 -->
        <div class="card">
            <h2>1. 현재 피부 상태</h2>
            <div class="form-group">
                <label for="acne-level">현재 여드름 진행 상태</label>
                <select id="acne-level" required>
                    <option value="">선택해주세요</option>
                    <option value="mild">경미함 (좁쌀 여드름 위주, 가끔 1~2개 발생)</option>
                    <option value="moderate">보통 (구진/화농성 여드름이 얼굴 전체에 붉게 분포)</option>
                    <option value="severe">심함 (결절성/낭종성 여드름, 염증이 깊고 통증 동반)</option>
                </select>
            </div>
        </div>

        <!-- 2. 선호 식품 선택 -->
        <div class="card">
            <h2>2. 선호하는 피부 건강 식품 (중복 선택 가능)</h2>
            <p style="font-size: 0.85rem; color: #777; margin-bottom: 12px;">선택하신 음식을 바탕으로 피부 진정에 좋은 식단을 조합해 드립니다.</p>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" name="food" value="연어/고등어"> 🐟 연어/고등어</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="아보카도"> 🥑 아보카도</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="토마토"> 🍅 토마토</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="시금치/브로콜리"> 🥦 시금치/브로콜리</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="블루베리"> 🫐 블루베리</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="견과류(아몬드/호두)"> 🥜 견과류</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="닭가슴살"> 🍗 닭가슴살</label>
                <label class="checkbox-item"><input type="checkbox" name="food" value="두부/콩류"> 🫘 두부/콩류</label>
            </div>
        </div>

        <!-- 3. 일상 일정 입력 (수면 불가능 시간 설정) -->
        <div class="card">
            <h2>3. 일상 일정 (수면 불가 시간대 설정)</h2>
            <div class="form-group">
                <label for="morning-busy">아침 이동/활동 시작 시간 (이 전에는 자야 함/일어나야 함)</label>
                <input type="time" id="morning-busy" required value="08:00">
            </div>
            <div class="form-group">
                <label for="evening-busy">저녁 일과/귀가 완료 시간 (이 후부터 개인 휴식/수면 가능)</label>
                <input type="time" id="evening-busy" required value="22:00">
            </div>
        </div>

        <button type="submit" class="btn-submit">맞춤형 피부 개선 루틴 생성하기</button>
    </form>

    <!-- 4. 결과 출력 섹션 -->
    <div id="result-section" class="card" style="margin-top: 30px;">
        <h2>📋 나만의 여드름 케어 하루 루틴</h2>
        <div id="routine-list"></div>
        
        <div class="tip-box">
            <h4>💡 여드름 개선 핵심 팁</h4>
            <p id="acne-tip">입력하신 정보에 따른 피부 케어 팁이 여기에 표시됩니다.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('skin-form').addEventListener('submit', function(e) {
        e.preventDefault();

        // 입력값 가져오기
        const acneLevel = document.getElementById('acne-level').value;
        const morningTime = document.getElementById('morning-busy').value;
        const eveningTime = document.getElementById('evening-busy').value;
        
        const selectedFoods = Array.from(document.querySelectorAll('input[name="food"]:checked'))
                                  .map(cb => cb.value);

        // 간단한 수면 및 식사 시간 계산
        const [mHour, mMin] = morningTime.split(':').map(Number);
        const [eHour, eMin] = eveningTime.split(':').map(Number);

        // 피부 재생을 위해 권장되는 취침/기상 시간 계산 (기상 시간은 아침 활동 시작 1~1.5시간 전)
        let wakeHour = mHour - 1;
        let wakeMin = mMin;
        if (wakeHour < 0) wakeHour += 24;

        // 적정 수면시간 7.5~8시간 확보를 위한 취침 시간 계산
        let sleepHour = wakeHour - 8;
        if (sleepHour < 0) sleepHour += 24;

        const formatTime = (h, m) => `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

        // 음식 조합
        const foodListText = selectedFoods.length > 0 
            ? selectedFoods.join(', ') 
            : '기본 권장 식품 (채소 위주, 견과류, 두부 등)';

        // 여드름 상태별 팁
        let tipText = "";
        if (acneLevel === 'mild') {
            tipText = "좁쌀 여드름 위주의 피부입니다. 과도한 세안보다는 수분 충전과 규칙적인 유수분 밸런스 유지가 중요합니다.";
        } else if (acneLevel === 'moderate') {
            tipText = "염증성 여드름이 진행 중입니다. 밤 11시~새벽 2시 사이 피부 재생 시간에 반드시 깊은 수면을 취하고, 혈당을 빠르게 올리는 음식을 피해주세요.";
        } else if (acneLevel === 'severe') {
            tipText = "심한 염증성 상태입니다. 규칙적인 수면과 식습관 병행은 필수이며, 손으로 터치하는 것을 극도로 자제하고 전문 피부과 진료를 병행하는 것을 권장합니다.";
        }

        // 결과 생성
        const routineHTML = `
            <div class="routine-item">
                <span class="time-badge">${formatTime(wakeHour, wakeMin)}</span>
                <div class="routine-content">
                    <h4>기상 및 미온수 세안</h4>
                    <p>기상 후 미지근한 물로 자극 없이 세안하고, 미지근한 물 한 잔으로 약한 독소를 배출하세요.</p>
                </div>
            </div>

            <div class="routine-item">
                <span class="time-badge">${formatTime(mHour, mMin)}</span>
                <div class="routine-content">
                    <h4>아침 식사 & 하루 시작</h4>
                    <p><strong>추천 메뉴:</strong> ${selectedFoods.includes('블루베리') || selectedFoods.includes('아보카도') ? '아보카도/블루베리를 활용한 가벼운 샐러드' : '항산화 식품 위주의 가벼운 식사'}</p>
                </div>
            </div>

            <div class="routine-item">
                <span class="time-badge">12:30</span>
                <div class="routine-content">
                    <h4>점심 식사 (피부 항산화 식단)</h4>
                    <p><strong>추천 메뉴:</strong> ${foodListText} 중 하나 이상을 활용한 균형 잡힌 저당 식단</p>
                </div>
            </div>

            <div class="routine-item">
                <span class="time-badge">${eveningTime}</span>
                <div class="routine-content">
                    <h4>저녁 일과 마감 & 꼼꼼한 클렌징</h4>
                    <p>귀가 후 자극 없는 1차/2차 클렌징으로 피부 노폐물을 제거하고 수분 크림을 충분히 발라주세요.</p>
                </div>
            </div>

            <div class="routine-item">
                <span class="time-badge">${formatTime(sleepHour, 0)}</span>
                <div class="routine-content">
                    <h4>취침 준비 (피부 재생 시간 확보)</h4>
                    <p>스마트폰 사용을 줄이고 최소 7~8시간의 수면을 확보하여 피부 호르몬 분비를 촉진하세요.</p>
                </div>
            </div>
        `;

        // 결과 화면 표시
        document.getElementById('routine-list').innerHTML = routineHTML;
        document.getElementById('acne-tip').innerText = tipText;
        document.getElementById('result-section').style.display = 'block';

        // 결과 화면으로 스크롤 이동
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
